<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Finished — {{ totals.team_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>

  <!-- Toast container (optional; stays stock Bootstrap) -->
  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  <div class="container th-scope" style="max-width: 900px; margin: 0 auto; padding: 16px; mt-3">
    <h2>🏁 Game Finished — {{ totals.team_name }}</h2>

    {% if end_reason == 'timeup' %}
<div class="alert alert-timeup text-center fw-bold" role="alert">
    ⏰ TIME IS UP
</div>
{% endif %}

      <h2>Results coming soon...</h2>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
