<!-- treasurehunt.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Treasure Hunt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <h2>Quest {{ quest.quest_number }}</h2>
    <p>{{ quest.text }}</p>
    {% if quest.image_path %}
    <img src="{{ url_for('static', filename=quest.image_path) }}" alt="Quest Image" style="max-width:300px;">
    {% endif %}

    <form id="answer-form" action="/submit" method="post" enctype="multipart/form-data">
        <input type="hidden" name="quest_id" value="{{ quest._id }}">

        {% if quest.correct_answers and quest.correct_answers.strip() %}
        <label for="answer">Your Answer:</label>
        <input type="text" id="answer" name="answer">
        <br>
        {% endif %}

        {% if quest.file_required %}
        <label for="uploaded_file">Upload File:</label>
        <input type="file" id="uploaded_file" name="uploaded_file">
        <br>
        {% endif %}

        <button id="submit-btn" type="submit">Submit</button>
    </form>


    {% if quest.hint %}
    <button id="hint-btn" type="button">Show Hint</button>
    <div id="hint-content" style="display:none;">
        <p>{{ quest.hint }}</p>
    </div>
    {% endif %}

    <div id="quest-timer"></div>
    <div id="hint-timer"></div>

    <!-- Only ONE JS include here! -->
    <script src="{{ url_for('static', filename='js/timersHandler.js') }}"></script>
</body>

</html>
